name: 功能请求 | Feature Request
description: 提出你对本项目的功能建议 | Suggest an idea for this project
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请详细描述你的需求。
        Thank you for your suggestion! Please describe your needs in detail.

        **上 GitHub 很慢？可以使用飞书文档提交反馈哦~** | **GitHub is slow? You can submit your feedback via Feishu form.**
        [进入飞书表单](https://inkcanvasforclass.feishu.cn/share/base/form/shrcnTufO72M20l1UsjQWcpv29e) | [Feishu Form](https://inkcanvasforclass.feishu.cn/share/base/form/shrcnTufO72M20l1UsjQWcpv29e)
  - type: markdown
    attributes:
      value: |
        > [!important]
        > 重要：如果您想要提出 **多项功能**，请为每一个功能开一个单独的 issue。
        > Important: If you want to request **multiple features**, please open a separate issue for each feature.

        > [!note]
        > 上传附件时**请优先使用 GitHub 的附件系统上传附件**，将需要上传的附件粘贴或拖动到撰写区域即可上传。多个文件可打包为 zip 格式后上传。**尽量避免使用需要登陆或安装客户端才能接收附件的网盘（如\*度网盘、\*克网盘、1\*3网盘等）上传附件**，以避免开发者因不具有对应网盘客户端或账户而延误问题诊断。
        > When uploading attachments, **please use GitHub's attachment system first**. Paste or drag files into the editor to upload. Multiple files can be packed as a zip. **Avoid cloud drives that require login or a client (e.g. Baidu Netdisk, Quark Netdisk, 123 Pan)** so maintainers can access them without extra accounts.
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单 | Checklist
      description: 在提交功能请求前，请先确认以下内容 | Please confirm the following before submitting a feature request
      options:
        - label: 您确认此功能不存在于最新版本 | You confirm that this feature does not exist in the latest version.
          required: true
        - label: 您确认此功能有开发的必要 | You confirm that this feature is worth developing.
          required: true
        - label: 您确认此功能无法通过开发插件/自动化实现 | You confirm that this feature cannot be implemented through a plugin or automation.
          required: true
        - label: 您没有为软件提交 Pull Request 或开发插件的能力 | You are unable to submit a Pull Request or develop a plugin for this software.
          required: true
        - label: 您了解开发者无法及时回复和及时开发 | You understand that developers may not respond or implement features promptly.
          required: true
        - label: 我已经仔细阅读过选项里的内容，并且知道这个选项不用勾选。 | I have carefully read the options and know that this option does not need to be checked.
  - type: textarea
    id: description
    attributes:
      label: 功能描述 | Description
      description: 请描述你希望添加的功能 | Describe the feature you want
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 需求动机 | Motivation
      description: 为什么需要这个功能？| Why do you need this feature?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 期望设计 | Expected Design
      description: （可选）描述或画出你期望的界面或交互 | (Optional) Describe or sketch the expected UI/UX
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 其他补充信息 | Additional Info
      description: 其他补充说明或建议 | Any other context or suggestions
    validations:
      required: false
  - type: upload
    id: files
    attributes:
      label: 上传有关文件 | Upload relevant files
      description: "你可以在此处上传相关文件 | You can upload relevant files here."
    validations:
      required: false
