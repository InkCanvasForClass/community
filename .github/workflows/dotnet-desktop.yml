name: .NET Build & Package

on:
  push:
    branches: [net6]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build & Package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [AnyCPU, x86]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore Package
        run: |
          $runtimeIdentifier = if ("${{ matrix.architecture }}" -eq "AnyCPU") { "win-x64" } else { "win-x86" }
          dotnet restore "Ink Canvas/InkCanvasForClass.csproj" --locked-mode -p:Platform="${{ matrix.architecture }}"

      - name: Publish single-file app
        env:
          DLASS_TELEMETRY_TOKEN: ${{ secrets.DLASS_TELEMETRY_TOKEN }}
        run: |
          $runtimeIdentifier = if ("${{ matrix.architecture }}" -eq "AnyCPU") { "win-x64" } else { "win-x86" }
          $publishDir = "artifacts/publish/${{ matrix.architecture }}"

          dotnet publish "Ink Canvas/InkCanvasForClass.csproj" `
            --configuration Debug `
            --no-restore `
            --runtime $runtimeIdentifier `
            --self-contained true `
            --output $publishDir `
            -p:Platform="${{ matrix.architecture }}" `
            -p:GitFlow="Github Action" `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:UseMultiToolTask=true `
            -p:EnforceProcessCountAcrossBuilds=true `
            -p:RunAnalyzers=false

      - name: Check if exe file is generated
        id: check-exe
        run: |
          $exePath = "artifacts/publish/${{ matrix.architecture }}/InkCanvasForClass.exe"

          if (Test-Path $exePath) {
            echo "build_success=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "build_success=false" >> $env:GITHUB_OUTPUT
            
            if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              exit 1
            }
          }

      - name: Create Package (if build succeeded)
        id: create-archive
        if: steps.check-exe.outputs.build_success == 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $version = "debug-$shortSha-$env:GITHUB_RUN_NUMBER"
          echo "archive_name=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Artifact (if build succeeded)
        if: steps.check-exe.outputs.build_success == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: InkCanvasForClass.CE.debug.${{ matrix.architecture }}
          path: "artifacts/publish/${{ matrix.architecture }}/*"

      - name: Create Summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Build Summary"
            echo ""

            if [ "${{ steps.check-exe.outputs.build_success }}" = "true" ]; then
              echo "## ✅ Build Successful"
              echo ""
              echo "**Commit:** \`${{ github.sha }}\`"
              echo "**Run:** #${{ github.run_number }}"
              echo "**Version:** ${{ steps.create-archive.outputs.archive_name }}"
              echo "**Architecture:** ${{ matrix.architecture }}"
              echo ""
              echo "[Download Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              echo ""
              echo "[Nightly.link Download](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/InkCanvasForClass.CE.debug.${{ matrix.architecture }}.zip) \([GhProxy Fastly Mirror](https://cdn.gh-proxy.com/nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/InkCanvasForClass.CE.debug.${{ matrix.architecture }}.zip) / [GhProxy Mirror](https://gh-proxy.com/nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/InkCanvasForClass.CE.debug.${{ matrix.architecture }}.zip)\)"
            else
              echo "## ❌ Build Failed"
              echo ""
              echo "**Event:** ${{ github.event_name }} (${{ github.event.action || 'N/A' }})"
              echo "**Commit:** \`${{ github.sha }}\`"
              echo "**Architecture:** ${{ matrix.architecture }}"
              echo "**Run:** #${{ github.run_number }}"
              echo ""
              echo "Check build logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
