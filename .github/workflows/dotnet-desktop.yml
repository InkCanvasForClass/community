name: Stable VSTO Build

on:
  push:
    branches: [net6]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug]
        architecture: [AnyCPU, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        run: dotnet restore "Ink Canvas.sln" --locked-mode

      # =========================
      # 1. 证书处理
      # =========================
      - name: Prepare PFX certificate
        shell: pwsh
        run: |
          if ("${{ secrets.CERT_PFX_BASE64 }}" -ne "") {
            [IO.File]::WriteAllBytes(
              "clickonce.pfx",
              [Convert]::FromBase64String("${{ secrets.CERT_PFX_BASE64 }}")
            )
            Write-Host "Certificate restored from secrets"
          } else {
            $cert = New-SelfSignedCertificate `
              -Type CodeSigningCert `
              -Subject "CN=ICC PowerPoint Agent CI" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeyExportPolicy Exportable `
              -NotAfter (Get-Date).AddYears(2)

            $pwd = ConvertTo-SecureString "" -AsPlainText -Force

            Export-PfxCertificate `
              -Cert $cert `
              -FilePath "clickonce.pfx" `
              -Password $pwd

            Write-Host "Generated self-signed certificate"
          }

      # =========================
      # 2. 主程序构建
      # =========================
      - name: Build main app
        env:
          DLASS_TELEMETRY_TOKEN: ${{ secrets.DLASS_TELEMETRY_TOKEN }}
        run: |
          msbuild "Ink Canvas\InkCanvasForClass.csproj" `
            /p:Platform=${{ matrix.architecture }} `
            /p:Configuration=${{ matrix.configuration }} `
            /p:GitFlow="$GITFLOW" `
            /m /p:UseMultiToolTask=true /p:EnforceProcessCountAcrossBuilds=true `
            /verbosity:minimal -maxcpucount /p:RunAnalyzers=false

      # =========================
      # 3. VSTO Build
      # =========================
      - name: Build VSTO Add-in
        shell: pwsh
        run: |
          $cfg = "${{ matrix.configuration }}"

          if ($cfg -eq "Debug") {
            $sign = "false"
          } else {
            $sign = "true"
          }

          msbuild "InkCanvas.PowerPointAddIn\InkCanvas.PowerPointAddIn.csproj" `
            /p:Configuration=$cfg `
            /p:SignManifests=$sign `
            /p:ManifestKeyFile=clickonce.pfx `
            /p:ManifestCertificatePassword="" `
            /p:ManifestCertStoreLocation="" `
            /verbosity:minimal

      # =========================
      # 4. 产物整理
      # =========================
      - name: Collect VSTO artifacts
        shell: pwsh
        run: |
          $cfg = "${{ matrix.configuration }}"
          $arch = "${{ matrix.architecture }}"

          # VSTO DLL + vsto + contracts → ppt-agent/
          $mainOut = "Ink Canvas\bin\$cfg\$arch\net6.0-windows10.0.19041.0"
          $pptAgentDir = "$mainOut\ppt-agent"
          New-Item -ItemType Directory -Force -Path $pptAgentDir | Out-Null

          Copy-Item "InkCanvas.PowerPointAddIn\bin\$cfg\InkCanvas.PowerPointAddIn.dll" $pptAgentDir -Force
          Copy-Item "InkCanvas.PowerPointAddIn\bin\$cfg\InkCanvas.PowerPointAddIn.vsto" $pptAgentDir -Force -ErrorAction SilentlyContinue
          Copy-Item "InkCanvas.PowerPointAddIn\bin\$cfg\InkCanvas.PowerPointAddIn.dll.manifest" $pptAgentDir -Force -ErrorAction SilentlyContinue
          Copy-Item "InkCanvas.PptAgent.Contracts\bin\$cfg\netstandard2.0\InkCanvas.PptAgent.Contracts.dll" $pptAgentDir -Force

          # VSTO Runtime DLLs → 主输出目录（regasm / ClickOnce 加载依赖）
          $vstoRuntime = "C:\Program Files (x86)\Microsoft Visual Studio\2022\Community\Common7\IDE\ReferenceAssemblies\v4.0"
          if (Test-Path $vstoRuntime) {
            @("Microsoft.Office.Tools.dll","Microsoft.Office.Tools.Common.dll","Microsoft.Office.Tools.Common.v4.0.Utilities.dll","Microsoft.Office.Tools.v4.0.Framework.dll","Microsoft.VisualStudio.Tools.Applications.Runtime.dll") | ForEach-Object {
              Copy-Item "$vstoRuntime\$_" $mainOut -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Check exe exists
        id: check-exe
        run: |
          $exePath = "Ink Canvas\bin\${{ matrix.configuration }}\${{ matrix.architecture }}\net6.0-windows10.0.19041.0\InkCanvasForClass.exe"
          if (Test-Path $exePath) {
            echo "build_success=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "build_success=false" >> $env:GITHUB_OUTPUT
          fi

      - name: Create Summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Build Summary"
            echo ""
            if [ "${{ steps.check-exe.outputs.build_success }}" = "true" ]; then
              echo "## ✅ Build Successful"
              echo "**Config:** ${{ matrix.configuration }} | **Arch:** ${{ matrix.architecture }}"
              echo "**Commit:** \`${{ github.sha }}\`"
            else
              echo "## ❌ Build Failed"
              echo "**Config:** ${{ matrix.configuration }} | **Arch:** ${{ matrix.architecture }}"
              echo "**Commit:** \`${{ github.sha }}\`"
              echo "Check build logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
