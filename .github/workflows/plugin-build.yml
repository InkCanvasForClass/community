name: ICC-CE Plugin Build (shared)

# 共享插件构建工作流：供所有 net6 插件仓库（CountdownDays / FunctionInsert /
# PdfReader / SamplePlugin / SeewoAutoLogin 等）通过 workflow_call 复用。
#
# 核心约定：插件编译依赖宿主 SDK（InkCanvas.PluginSdk.dll / InkCanvas.Controls.dll），
# 这里统一从本仓库（community, net6 分支）构建后同步进插件的 lib/，保证插件
# 始终基于最新宿主 SDK 编译，无需手动提交 DLL。随后构建插件、校验产物、
# 打包 .icpx，可选创建 GitHub Release。

on:
  workflow_call:
    inputs:
      # 插件入口项目文件，相对插件仓库根目录（如 "CountdownDays.csproj"）
      project:
        type: string
        required: true
      # 插件清单 Id，用于产物/Release 命名
      plugin_id:
        type: string
        required: true
      # 插件显示名（Release 标题用）
      plugin_name:
        type: string
        required: false
        default: ""
      # 插件功能描述（Release 正文用）
      plugin_description:
        type: string
        required: false
        default: ""
      # true = 手动发版模式：release_tag 非空时把 .icpx 附加到该 tag 的 GitHub Release。
      # 手动发版（release.yml：push tag / dispatch）传 true + release_tag；
      # 自动发版（build.yml：push main 版本更新）传 auto_release，无需此开关。
      create_release:
        type: boolean
        required: false
        default: false
      # create_release=true 时附加 .icpx 的 Release tag（如 v1.0.0）
      release_tag:
        type: string
        required: false
        default: ""
      # true = push 到 main 且 manifest.json 的 Version 对应的 release 不存在时，
      # 自动以 v{Version} 创建 GitHub Release（版本号更新自动发版，幂等）。
      # 与 create_release 独立：create_release 走显式 release_tag。
      auto_release:
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6.0.2
        with:
          path: plugin

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore "plugin/${{ inputs.project }}"

      - name: Build
        run: dotnet build "plugin/${{ inputs.project }}" --configuration Release --no-restore

      - name: Resolve output directory
        id: outdir
        shell: pwsh
        run: |
          $csproj = "plugin/${{ inputs.project }}"
          $pluginRoot = Split-Path -Parent $csproj
          $outDir = Join-Path $pluginRoot "bin/Release/net6.0-windows10.0.19041.0"
          if (-not (Test-Path $outDir)) {
            $outDir = Join-Path $pluginRoot "bin/x64/Release/net6.0-windows10.0.19041.0"
          }
          if (-not (Test-Path $outDir)) { throw "找不到构建输出目录：$csproj" }
          "out_dir=$outDir" >> $env:GITHUB_OUTPUT

      - name: Validate build output
        shell: pwsh
        run: |
          $outDir = "${{ steps.outdir.outputs.out_dir }}"
          foreach ($f in @('manifest.json')) {
            if (-not (Test-Path (Join-Path $outDir $f))) { throw "缺少构建产物：$f" }
          }

          # 宿主已嵌入 WinRT 投影程序集，SDK/Controls 是 Private=False，
          # 这些不该出现在插件包里；出现即说明引用配置被改坏了。
          $forbidden = @(
            'WinRT.Runtime.dll',
            'Microsoft.Windows.SDK.NET.dll',
            'InkCanvas.PluginSdk.dll',
            'InkCanvas.Controls.dll'
          )
          foreach ($f in $forbidden) {
            if (Test-Path (Join-Path $outDir $f)) {
              throw "输出目录出现不应分发的程序集：$f"
            }
          }
          Write-Host "输出校验通过：$outDir"

      - name: Package .icpx
        id: package
        shell: pwsh
        run: |
          $outputDir = "${{ steps.outdir.outputs.out_dir }}"
          $manifest = Get-Content (Join-Path $outputDir "manifest.json") | ConvertFrom-Json
          $pluginId = $manifest.Id

          $staging = Join-Path $env:RUNNER_TEMP "icpx_$pluginId"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null

          foreach ($f in @("manifest.json", $manifest.EntranceAssembly,
                           "$($manifest.EntranceAssembly -replace '\.dll$','.deps.json')")) {
            $src = Join-Path $outputDir $f
            if (-not (Test-Path $src)) { throw "缺少打包文件：$src" }
            Copy-Item $src $staging
          }

          $icpxName = "$pluginId.icpx"
          $icpxPath = Join-Path $env:GITHUB_WORKSPACE $icpxName
          if (Test-Path $icpxPath) { Remove-Item $icpxPath }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($staging, $icpxPath)

          # .icpx 必须只含这几个文件，多一个都可能被宿主插件校验拒绝。
          $zip = [System.IO.Compression.ZipFile]::OpenRead($icpxPath)
          try { $entries = $zip.Entries | ForEach-Object { $_.FullName } }
          finally { $zip.Dispose() }

          $expected = @('manifest.json',
                        $manifest.EntranceAssembly,
                        "$($manifest.EntranceAssembly -replace '\.dll$','.deps.json')")
          $unexpected = $entries | Where-Object { $_ -notin $expected }
          if ($unexpected) { throw "包内出现意外条目：$($unexpected -join ', ')" }
          $missing = $expected | Where-Object { $_ -notin $entries }
          if ($missing) { throw "包内缺少条目：$($missing -join ', ')" }

          $hash = (Get-FileHash $icpxPath -Algorithm SHA256).Hash.ToLower()
          "icpx_path=$icpxName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "version=$($manifest.Version)" >> $env:GITHUB_OUTPUT
          "plugin_id=$pluginId" >> $env:GITHUB_OUTPUT
          Write-Host "Packaged: $icpxName (SHA256: $hash, entries: $($entries -join ', '))"

      - name: Upload .icpx artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.plugin_id }}
          path: ${{ steps.package.outputs.icpx_path }}
          if-no-files-found: error

      # 解析 Release tag：显式 release_tag 优先（手动发版）；
      # 否则 auto_release 时以 manifest.json 的 Version 推导 v{Version}，
      # 仅限 push 到 main，且同名 release 已存在则跳过（幂等，版本号更新自动触发）。
      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag) {
            $isMainPush = ("${{ github.event_name }}" -eq "push") -and ("${{ github.ref }}" -eq "refs/heads/main")
            if ("${{ inputs.auto_release }}" -eq "true" -and $isMainPush) {
              $manifest = Get-Content (Join-Path "${{ steps.outdir.outputs.out_dir }}" "manifest.json") | ConvertFrom-Json
              $candidate = "v$($manifest.Version)"
              # release 不存在时 gh release view 返回非零退出码——这是存在性探测的预期行为。
              # GitHub Actions 的 pwsh 包装器会把最后的 $LASTEXITCODE 当作步骤退出码，
              # 若不复位，探测"不存在"会让本步骤误报失败。这里显式捕获并复位。
              gh release view $candidate --repo "${{ github.repository }}" 2>$null | Out-Null
              $probeCode = $LASTEXITCODE
              $LASTEXITCODE = 0
              if ($probeCode -eq 0) {
                Write-Host "Release $candidate 已存在，跳过自动发版"
              } else {
                Write-Host "版本更新到 $candidate，自动发版"
                $tag = $candidate
              }
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # 无论是否自动发版，本步骤都成功结束。
          exit 0

      - name: Create GitHub Release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ inputs.plugin_name }} v${{ steps.package.outputs.version }}
          body: |
            ## ${{ steps.package.outputs.plugin_id }} v${{ steps.package.outputs.version }}

            ${{ inputs.plugin_description }}

            ### 安装方法
            1. 下载下方的 `.icpx` 文件
            2. 将其放入 ICC-CE 的 `PluginPackages/` 目录
            3. 重启 ICC-CE 即可自动安装

            ### 校验信息
            ```
            SHA256: ${{ steps.package.outputs.sha256 }}
            ```
          files: ${{ steps.package.outputs.icpx_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
