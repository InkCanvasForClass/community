name: Sync net6 to net10

# 当 net6 分支有提交时，自动合并到 net10 分支
# 如果编译失败（可能是 net6 新增的包不支持 net10），则自动升级 NuGet 包到最新稳定版并重试
#
# 策略：
#   1. 合并 net6 → net10（冲突自动解决：csproj 取 net6 + TFM 改回 net10）
#   2. 删除旧 packages.lock.json
#   3. 先尝试 restore + build（大多数包同时支持 net6/net10，无需升级）
#   4. 如果 build 失败 → 升级所有 NuGet 包到最新稳定版 → 重新 restore + build
#   5. 编译通过才推送，否则中止报警

on:
  push:
    branches: [net6]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-net6-to-net10
  cancel-in-progress: false

jobs:
  sync:
    name: Merge net6 → net10
    runs-on: windows-latest
    steps:
      - name: Checkout net10 branch
        uses: actions/checkout@v6
        with:
          ref: net10
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Fetch net6 and merge
        shell: pwsh
        env:
          ERROR_ACTION_PREFERENCE: Continue
        run: |
          git fetch origin net6
          $mergeOutput = git merge origin/net6 --no-edit 2>&1
          Write-Host $mergeOutput
          $mergeExit = $LASTEXITCODE

          if ($mergeExit -ne 0) {
            Write-Host "合并存在冲突，开始自动解决..."
            $status = git status --porcelain
            $conflicted = $status | Where-Object { $_ -match "^(UU|AA|DU|UD|AU|UA)" }

            if (-not $conflicted) {
              Write-Error "::error::合并失败但未检测到冲突文件，可能存在其他问题"
              git merge --abort
              exit 1
            }

            Write-Host "冲突文件列表:"
            $conflicted | ForEach-Object { Write-Host "  $_" }

            # 1) csproj 冲突：取 net6 版本（ theirs ），然后把 TFM 改回 net10
            $csprojConflicts = $conflicted | Where-Object { $_ -match "\.csproj\s*$" }
            foreach ($line in $csprojConflicts) {
              $path = ($line -replace "^.{2}\s+", "").Trim()
              Write-Host "解决 csproj 冲突（取 net6 + 改 TFM）: $path"
              git checkout --theirs $path
              (Get-Content $path -Raw) -replace 'net6\.0-windows10\.0\.19041\.0', 'net10.0-windows10.0.19041.0' | Set-Content $path -NoNewline
              git add $path
            }

            # 2) packages.lock.json 冲突：直接删除，后续 restore 会重新生成
            $lockConflicts = $conflicted | Where-Object { $_ -match "packages\.lock\.json\s*$" }
            foreach ($line in $lockConflicts) {
              $path = ($line -replace "^.{2}\s+", "").Trim()
              Write-Host "删除冲突的 lock 文件（稍后重新生成）: $path"
              git rm -f $path 2>$null
              if (Test-Path $path) { Remove-Item $path -Force }
            }

            # 3) .yml workflow 冲突：取 net10 版本（ ours ），保留 net10 的触发分支配置
            $ymlConflicts = $conflicted | Where-Object { $_ -match "\.ya?ml\s*$" }
            foreach ($line in $ymlConflicts) {
              $path = ($line -replace "^.{2}\s+", "").Trim()
              Write-Host "解决 yml 冲突（取 net10 版本）: $path"
              git checkout --ours $path 2>$null
              git add $path 2>$null
            }

            # 4) 其他文件冲突：优先取 net6 版本（ theirs ），保证新功能/修复能同步过来
            $otherConflicts = $conflicted | Where-Object { $_ -notmatch "\.csproj\s*$" -and $_ -notmatch "packages\.lock\.json\s*$" -and $_ -notmatch "\.ya?ml\s*$" }
            foreach ($line in $otherConflicts) {
              $path = ($line -replace "^.{2}\s+", "").Trim()
              Write-Host "解决其他冲突（取 net6 版本）: $path"
              git checkout --theirs $path 2>$null
              if ($LASTEXITCODE -eq 0) {
                git add $path
              } else {
                git checkout --ours $path 2>$null
                git add $path 2>$null
              }
            }

            git commit --no-edit 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) {
              Write-Error "::error::自动解决冲突后仍无法提交，需要人工介入"
              git merge --abort
              exit 1
            }
            Write-Host "冲突解决完成，合并已提交"
          } else {
            Write-Host "合并无冲突"
          }

          # 无论是否有冲突，都检查 TFM 是否被 net6 带回
          $csprojs = Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { $_.FullName -notmatch "PowerPointAddIn|IACoreHelper" }
          $tfmChanged = $false
          foreach ($csproj in $csprojs) {
            $content = Get-Content $csproj.FullName -Raw
            if ($content -match 'net6\.0-windows10\.0\.19041\.0') {
              Write-Host "检测到 $($csproj.Name) 的 TFM 被带回 net6，正在修复..."
              $content -replace 'net6\.0-windows10\.0\.19041\.0', 'net10.0-windows10.0.19041.0' | Set-Content $csproj.FullName -NoNewline
              $tfmChanged = $true
            }
          }
          if ($tfmChanged) {
            git add -A
            git commit -m "fix: restore net10.0 TFM after merge from net6 [skip ci]"
          }

      - name: Delete stale packages.lock.json
        shell: pwsh
        run: |
          $lockFiles = Get-ChildItem -Recurse -Filter "packages.lock.json" -ErrorAction SilentlyContinue
          foreach ($lf in $lockFiles) {
            Write-Host "删除旧 lock 文件: $($lf.FullName)"
            Remove-Item $lf.FullName -Force
          }

      - name: Try restore and build (without upgrading packages)
        id: try_build
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== 尝试直接 restore + build（不升级包）==="
          dotnet restore "Ink Canvas.sln" --verbosity minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::restore 失败，可能需要升级 NuGet 包"
            exit 1
          }
          dotnet build "Ink Canvas.sln" -c Release -p:Platform=x64 --no-restore --verbosity minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::初次编译失败，可能 net6 新增的包不支持 net10，将尝试升级包"
            exit 1
          }
          Write-Host "::notice::初次编译通过，无需升级 NuGet 包"

      - name: Upgrade NuGet packages to latest stable (only if first build failed)
        if: steps.try_build.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== 升级 NuGet 包到最新稳定版 ==="

          $csprojs = Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { $_.FullName -notmatch "PowerPointAddIn|IACoreHelper" }

          foreach ($csproj in $csprojs) {
            Write-Host "--- 处理 $($csproj.Name) ---"
            $content = Get-Content $csproj.FullName -Raw
            $packageMatches = [regex]::Matches($content, '<PackageReference\s+Include="([^"]+)"')
            $packages = $packageMatches | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique

            foreach ($pkg in $packages) {
              Write-Host "  尝试升级 $pkg ..."
              # 用 --no-restore 避免每次都 restore，最后统一 restore
              # 用 2>&1 捕获输出，ErrorActionPreference=Continue 防止 stderr 终止脚本
              $output = & dotnet add $csproj.FullName package $pkg --no-restore 2>&1
              $exitCode = $LASTEXITCODE
              $outputStr = ($output | Out-String).Trim()
              if ($exitCode -eq 0) {
                $match = [regex]::Match($outputStr, "version '([^']+)' added")
                if ($match.Success) {
                  Write-Host "    -> 升级到 $($match.Groups[1].Value)"
                } else {
                  Write-Host "    -> 已是最新或已更新"
                }
              } else {
                # 提取最后一行有用的信息
                $lastLine = ($outputStr -split "`n") | Where-Object { $_.Trim() } | Select-Object -Last 1
                Write-Host "    跳过: $lastLine"
              }
            }
          }
          Write-Host "包升级完成"

      - name: Restore and build (after upgrade)
        if: steps.try_build.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== 升级后重新 restore + build ==="
          dotnet restore "Ink Canvas.sln" --verbosity minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::升级后 restore 仍失败，NuGet 包可能不兼容 net10"
            exit 1
          }
          dotnet build "Ink Canvas.sln" -c Release -p:Platform=x64 --no-restore --verbosity minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::升级后 .NET 10 编译仍失败，需要人工介入解决兼容性问题"
            exit 1
          }
          Write-Host "::notice::升级后编译通过"

      - name: Commit and push
        id: push
        shell: pwsh
        run: |
          # 先提交工作区残留变更（如 TFM 修复、lock 文件等）
          git add -A
          $workdirChanges = git status --porcelain
          if ($workdirChanges) {
            git commit -m "chore(sync): apply net10 adjustments after merge from net6 [skip ci]"
          }

          # 关键：检测本地 HEAD 是否领先于 origin/net10（merge commit 可能已自动提交）
          # 用 rev-list 计算未推送的提交数
          $unpushed = git rev-list --count origin/net10..HEAD
          Write-Host "未推送的提交数: $unpushed"
          if ([int]$unpushed -gt 0) {
            Write-Host "=== 未推送的提交 ==="
            git log origin/net10..HEAD --oneline
            Write-Host "=== 推送到 net10 ==="
            git push origin net10
            Write-Host "::notice::同步完成，已推送到 net10"
            echo "pushed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::notice::无变更需要推送（本地与 origin/net10 一致）"
            echo "pushed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Trigger .NET Build & Package workflow
        if: steps.push.outputs.pushed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            // GITHUB_TOKEN 推送的 commit 不会自动触发其他 workflow，
            // 所以这里用 workflow_dispatch 主动触发 dotnet-desktop 构建
            const workflowId = 'dotnet-desktop.yml';
            const ref = 'net10';
            core.info(`触发 ${workflowId} 在 ${ref} 分支上运行...`);
            try {
              const resp = await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                ref: ref,
              });
              core.info(`已触发，HTTP ${resp.status}`);
              core.notice(`已触发 .NET Build & Package workflow 在 net10 分支上运行`);
            } catch (err) {
              core.error(`触发失败: ${err.message}`);
              core.setFailed(`无法触发 build workflow: ${err.message}`);
            }

      - name: Create summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Sync net6 → net10 Summary"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "## ✅ Sync Successful"
              echo ""
              echo "**Trigger commit:** \`${{ github.sha }}\`"
              echo "**Run:** #${{ github.run_number }}"
              echo ""
              if [ "${{ steps.try_build.outcome }}" = "success" ]; then
                echo "net6 的提交已自动合并到 net10，编译验证通过（无需升级 NuGet 包）。"
              else
                echo "net6 的提交已自动合并到 net10，NuGet 包已升级到最新稳定版，编译验证通过。"
              fi
            else
              echo "## ❌ Sync Failed"
              echo ""
              echo "**Trigger commit:** \`${{ github.sha }}\`"
              echo "**Run:** #${{ github.run_number }}"
              echo ""
              echo "自动同步失败，请检查日志处理冲突或兼容性问题："
              echo "- csproj 冲突：检查是否需要手动调整 TFM 或包引用"
              echo "- NuGet 包不兼容：检查 net6 新增的包是否支持 net10"
              echo "- 编译失败：检查代码兼容性"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
