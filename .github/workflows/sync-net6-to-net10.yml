name: Sync net6 to net10

# 当 net6 分支有提交时，把 net6 的提交同步到 net10 分支
# 如果编译失败（可能是 net6 新增的包不支持 net10），则自动升级 NuGet 包到最新稳定版并重试
#
# 策略：
#   0. 提交信息（标题或正文）里带 net6-only 标记（如 "[net6-only] fix: ..." 或 "net6 only"）的提交
#      只属于 net6，不同步到 net10
#   1. 提交信息里写 `resync: <sha1> <sha2> ...`（也接受 re-sync / sync-commits / 重新同步）时，
#      只重新同步这几个提交，忽略 net6-only 标记。用于修正历史后单独补同步
#   2. 其余情况按提交顺序 cherry-pick `origin/net10..origin/net6` 区间内所有非 net6-only 提交
#   3. 冲突自动解决：csproj 取 net10 的包升级 + 应用 net6 的包变更、lock 文件删除、
#      sync 工作流取 net6、其他文件取 net6
#   4. 删除旧 packages.lock.json，先尝试 restore + build
#   5. build 失败 → 升级所有 NuGet 包到最新稳定版 → 重新 restore + build
#   6. 编译通过才推送，否则中止报警
#
# 为什么不再用 merge + revert：
#   net6-only 的提交常被后续 net6 提交改写，merge 到 net10 后再 `git revert` 必然冲突；
#   若该提交的改动在 net10 上已有等价实现，revert 还会变成空提交直接失败。
#   从源头 cherry-pick 时跳过这些提交，就不需要事后回滚。

on:
  push:
    branches: [net6]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-net6-to-net10
  cancel-in-progress: false

jobs:
  sync:
    name: Merge net6 → net10
    runs-on: windows-latest
    steps:
      - name: Checkout net10 branch
        uses: actions/checkout@v6
        with:
          ref: net10
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Sync net6 commits to net10
        id: sync
        shell: pwsh
        env:
          ERROR_ACTION_PREFERENCE: Continue
        run: |
          $ErrorActionPreference = 'Continue'

          function Get-ConflictFiles {
            @((git diff --name-only --diff-filter=U -z) -split "`0" | Where-Object { $_ })
          }

          # 解决 cherry-pick 冲突。返回 $true 表示全部解决，可以 commit --no-edit 收尾。
          function Resolve-SyncConflicts {
            param([string[]]$Conflicted)
            if (-not $Conflicted -or $Conflicted.Count -eq 0) { return $false }

            Write-Host "冲突文件:"
            $Conflicted | ForEach-Object { Write-Host "  $_" }

            # 1) csproj：ours（net10）的行默认保留，net6 明确删掉的包从 ours 去掉，
            #    net6 新增的包补进来，最后把 TFM 改回 net10。
            $csprojConflicts = $Conflicted | Where-Object { $_ -match "\.csproj$" }
            foreach ($path in $csprojConflicts) {
              Write-Host "解决 csproj 冲突: $path"
              $bytes = [IO.File]::ReadAllBytes($path)
              $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
              $conflictText = [Text.Encoding]::UTF8.GetString($bytes)
              if ($hasBom) { $conflictText = $conflictText.Substring(1) }

              $baseText = (& git show ":1:$path" 2>$null) -join "`n"
              $theirsText = (& git show ":3:$path" 2>$null) -join "`n"
              $baseIds = @([regex]::Matches($baseText, 'PackageReference\s+Include="([^"]+)"') | ForEach-Object { $_.Groups[1].Value })
              $theirsIds = @([regex]::Matches($theirsText, 'PackageReference\s+Include="([^"]+)"') | ForEach-Object { $_.Groups[1].Value })

              $lines = $conflictText -split "`r`n"
              $resolved = [System.Collections.Generic.List[string]]::new()
              $i = 0
              while ($i -lt $lines.Count) {
                if ($lines[$i] -notlike '<<<<<<<*') { $resolved.Add($lines[$i]); $i++; continue }

                $ours = @(); $theirs = @(); $inTheirs = $false; $i++
                while ($i -lt $lines.Count -and $lines[$i] -notlike '>>>>>>>*') {
                  if ($lines[$i] -eq '=======') { $inTheirs = $true; $i++; continue }
                  if ($inTheirs) { $theirs += $lines[$i] } else { $ours += $lines[$i] }
                  $i++
                }
                $i++

                foreach ($line in $ours) {
                  if ($line -match 'PackageReference\s+Include="([^"]+)"') {
                    $id = $Matches[1]
                    if (($baseIds -contains $id) -and ($theirsIds -notcontains $id)) { continue }
                  }
                  $resolved.Add($line)
                }
                foreach ($line in $theirs) {
                  if ($line -match 'PackageReference\s+Include="([^"]+)"') {
                    $id = $Matches[1]
                    $already = @($resolved | Where-Object { $_ -match ('PackageReference\s+Include="' + [regex]::Escape($id) + '"') })
                    if ($already.Count -gt 0) { continue }
                  }
                  $resolved.Add($line)
                }
              }

              $finalText = ($resolved -join "`r`n") -replace 'net6\.0-windows10\.0\.19041\.0', 'net10.0-windows10.0.19041.0'
              [IO.File]::WriteAllText($path, $finalText, [Text.UTF8Encoding]::new($hasBom))
              git add -- $path
            }

            # 2) packages.lock.json：直接删除，后续 restore 会重新生成
            $lockConflicts = $Conflicted | Where-Object { $_ -match "packages\.lock\.json$" }
            foreach ($path in $lockConflicts) {
              Write-Host "删除冲突的 lock 文件: $path"
              git rm -f -- $path 2>$null
              if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
            }

            # 3) yml：同步工作流自身跟 net6 走（保证同步脚本永远是最新版），其他取 net10
            $ymlConflicts = $Conflicted | Where-Object { $_ -match "\.ya?ml$" }
            foreach ($path in $ymlConflicts) {
              if ($path -match "sync-net6-to-net10\.yml$") {
                Write-Host "解决 yml 冲突（取 net6 版本）: $path"
                git checkout --theirs -- $path 2>$null
                if ($LASTEXITCODE -ne 0) { git checkout --ours -- $path 2>$null }
              } else {
                Write-Host "解决 yml 冲突（取 net10 版本）: $path"
                git checkout --ours -- $path 2>$null
                if ($LASTEXITCODE -ne 0) { git checkout --theirs -- $path 2>$null }
              }
              git add -- $path 2>$null
            }

            # 4) net10 / net6 各自新增内容的文件：冲突块取并集，
            #    否则 net10 独有的定义（如 ScanColorMode、MigrateVideoBoothSettings）
            #    会被 net6 版本整文件覆盖，导致 net10 编译失败
            $unionPattern = '(Resources[\\/]Settings\.cs|SettingsManager\.cs|MW_SettingsToLoad\.cs)$'
            $unionConflicts = $Conflicted | Where-Object { $_ -match "\.cs$" -and $_ -match $unionPattern }
            foreach ($path in $unionConflicts) {
              Write-Host "解决冲突（两边内容取并集）: $path"
              $bytes = [IO.File]::ReadAllBytes($path)
              $hasBom = ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)
              $text = [Text.Encoding]::UTF8.GetString($bytes)
              if ($hasBom) { $text = $text.Substring(1) }

              $lines = $text -split "`r`n"
              $merged = [System.Collections.Generic.List[string]]::new()
              $i = 0
              while ($i -lt $lines.Count) {
                if ($lines[$i] -notlike '<<<<<<<*') { $merged.Add($lines[$i]); $i++; continue }

                $ours = @(); $theirs = @(); $inTheirs = $false; $i++
                while ($i -lt $lines.Count -and $lines[$i] -notlike '>>>>>>>*') {
                  if ($lines[$i] -eq '=======') { $inTheirs = $true; $i++; continue }
                  if ($inTheirs) { $theirs += $lines[$i] } else { $ours += $lines[$i] }
                  $i++
                }
                $i++

                # ours 块末尾往往缺右括号：冲突块两侧共用同一行 "}"（例如两个枚举定义之间）。
                # 只拼 ours + theirs 会少一个 "}"，整个文件语法错误，这里按差值补齐。
                $delta = 0
                foreach ($line in $ours) {
                  $delta += ($line.Length - $line.Replace('{', '').Length) - ($line.Length - $line.Replace('}', '').Length)
                }
                $merged.AddRange([string[]]$ours)
                if ($delta -gt 0) {
                  $indent = ''
                  foreach ($line in $ours) {
                    if ($line.Trim()) { $indent = $line.Substring(0, $line.Length - $line.TrimStart().Length); break }
                  }
                  for ($k = 0; $k -lt $delta; $k++) { $merged.Add($indent + '}') }
                }
                $merged.AddRange([string[]]$theirs)
              }

              [IO.File]::WriteAllText($path, ($merged -join "`r`n"), [Text.UTF8Encoding]::new($hasBom))
              git add -- $path
            }

            # 5) 其他文件：优先取 net6 版本，保证新功能/修复能同步过来
            $otherConflicts = $Conflicted | Where-Object { $_ -notmatch "\.csproj$" -and $_ -notmatch "packages\.lock\.json$" -and $_ -notmatch "\.ya?ml$" -and ($_ -notmatch $unionPattern) }
            foreach ($path in $otherConflicts) {
              Write-Host "解决其他冲突（取 net6 版本）: $path"
              git checkout --theirs -- $path 2>$null
              if ($LASTEXITCODE -eq 0) {
                git add -- $path
              } else {
                git checkout --ours -- $path 2>$null
                git add -- $path 2>$null
              }
            }

            $remaining = Get-ConflictFiles
            if ($remaining.Count -gt 0) {
              Write-Error ("::error::仍有未解决的冲突: " + ($remaining -join ", "))
              return $false
            }
            return $true
          }

          git fetch origin net6

          # ===== 1. 决定本次要同步哪些提交 =====
          $headMessage = (git log -1 --format=%B origin/net6 | Out-String)
          $resyncShas = @()
          foreach ($line in ($headMessage -split "`r?`n")) {
            if ($line -match '(?i)(?:resync|re-sync|sync-commits?|重新同步)\s*[:：=]?\s*([0-9a-f][0-9a-f\s,、]*)$') {
              $resyncShas += [regex]::Matches($Matches[1], '[0-9a-f]{7,40}') | ForEach-Object { $_.Value }
            }
          }
          $resyncShas = @($resyncShas | Select-Object -Unique)

          $skipPattern = '(?i)\[?net6[ -]only\]?'
          $toApply = @()

          if ($resyncShas.Count -gt 0) {
            Write-Host "::notice::提交信息指定了 resync 哈希，只重新同步: $($resyncShas -join ', ')"
            $ordered = @()
            foreach ($sha in $resyncShas) {
              $full = ((git rev-parse --verify ($sha + '^{commit}') 2>$null) -join '').Trim()
              if (-not $full) {
                Write-Error "::error::找不到提交 $sha（resync 只支持 net6 上已存在的提交）"
                exit 1
              }
              $ct = [int64](((git show -s --format=%ct $full) -join '').Trim())
              $ordered += [pscustomobject]@{ Sha = $full; Time = $ct }
            }
            $toApply = @($ordered | Sort-Object Time | ForEach-Object { $_.Sha })
          } else {
            $incoming = @(git rev-list --reverse origin/net10..origin/net6)
            if ($incoming.Count -eq 0) {
              Write-Host "::notice::net6 没有需要同步到 net10 的新提交"
              exit 0
            }
            foreach ($sha in $incoming) {
              $message = (git log -1 --format=%B $sha | Out-String)
              if ($message -match $skipPattern) {
                Write-Host "跳过 net6-only 提交: $(git log -1 --format='%h %s' $sha)"
                continue
              }
              $toApply += $sha
            }
            if ($toApply.Count -eq 0) {
              Write-Host "::notice::本次 net6 提交全部带 net6-only 标记，不同步到 net10"
              exit 0
            }
          }

          # ===== 2. 逐个 cherry-pick =====
          foreach ($sha in $toApply) {
            $subject = ((git log -1 --format='%h %s' $sha) | Out-String).Trim()
            Write-Host "==> 同步 $subject"

            git cherry-pick -x $sha
            if ($LASTEXITCODE -eq 0) { continue }

            $conflicted = Get-ConflictFiles
            if ($conflicted.Count -eq 0) {
              # 没有冲突也没产生改动：该提交的改动已等价存在于 net10
              Write-Host "::warning::$subject 在 net10 上没有产生改动，跳过"
              git cherry-pick --skip
              if ($LASTEXITCODE -ne 0) { git cherry-pick --abort 2>$null; exit 1 }
              continue
            }

            if (-not (Resolve-SyncConflicts -Conflicted $conflicted)) {
              git cherry-pick --abort 2>$null
              Write-Error ('::error::解决 ' + $subject + ' 的冲突失败，已中止。修正后可提交 resync: ' + $sha + ' 单独重试')
              exit 1
            }

            git add -A
            git commit --no-edit
            if ($LASTEXITCODE -ne 0) {
              git cherry-pick --abort 2>$null
              Write-Error "::error::$subject 冲突解决后仍无法提交"
              exit 1
            }
            Write-Host "冲突解决完成: $subject"
          }

          # ===== 3. 同步工作流自身跟随 net6 =====
          git checkout origin/net6 -- .github/workflows/sync-net6-to-net10.yml 2>$null
          if ($LASTEXITCODE -eq 0) { git add -- .github/workflows/sync-net6-to-net10.yml }

          # ===== 4. TFM 修复（cherry-pick 可能把 net6 的 TFM 带过来） =====
          $csprojs = Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { $_.FullName -notmatch "PowerPointAddIn|IACoreHelper" }
          $tfmChanged = $false
          foreach ($csproj in $csprojs) {
            $content = Get-Content $csproj.FullName -Raw
            if ($content -match 'net6\.0-windows10\.0\.19041\.0') {
              Write-Host "修复 $($csproj.Name) 的 TFM 为 net10"
              $content -replace 'net6\.0-windows10\.0\.19041\.0', 'net10.0-windows10.0.19041.0' | Set-Content $csproj.FullName -NoNewline
              $tfmChanged = $true
            }
          }
          if ($tfmChanged) { git add -A }

          # 暂存区还有改动（TFM / 工作流）就单独提交一次
          if (git diff --cached --name-only) {
            git commit -m "chore(sync): apply net10 adjustments after syncing from net6 [skip ci]"
          }

      - name: Delete stale packages.lock.json
        shell: pwsh
        run: |
          $lockFiles = Get-ChildItem -Recurse -Filter "packages.lock.json" -ErrorAction SilentlyContinue
          foreach ($lf in $lockFiles) {
            Write-Host "删除旧 lock 文件: $($lf.FullName)"
            Remove-Item $lf.FullName -Force
          }

      - name: Try restore and build (without upgrading packages)
        id: try_build
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== 尝试直接 restore + build（不升级包）==="
          dotnet restore "Ink Canvas.sln" --verbosity minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::restore 失败，可能需要升级 NuGet 包"
            exit 1
          }
          dotnet build "Ink Canvas.sln" -c Release -p:Platform=x64 --no-restore --verbosity minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::初次编译失败，可能 net6 新增的包不支持 net10，将尝试升级包"
            exit 1
          }
          Write-Host "::notice::初次编译通过，无需升级 NuGet 包"

      - name: Upgrade NuGet packages to latest stable (only if first build failed)
        if: steps.try_build.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== 升级 NuGet 包到最新稳定版 ==="

          $csprojs = Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { $_.FullName -notmatch "PowerPointAddIn|IACoreHelper" }

          foreach ($csproj in $csprojs) {
            Write-Host "--- 处理 $($csproj.Name) ---"
            $content = Get-Content $csproj.FullName -Raw
            $packageMatches = [regex]::Matches($content, '<PackageReference\s+Include="([^"]+)"')
            $packages = $packageMatches | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique

            foreach ($pkg in $packages) {
              Write-Host "  尝试升级 $pkg ..."
              $output = & dotnet add $csproj.FullName package $pkg --no-restore 2>&1
              $exitCode = $LASTEXITCODE
              $outputStr = ($output | Out-String).Trim()
              if ($exitCode -eq 0) {
                $match = [regex]::Match($outputStr, "version '([^']+)' added")
                if ($match.Success) {
                  Write-Host "    -> 升级到 $($match.Groups[1].Value)"
                } else {
                  Write-Host "    -> 已是最新或已更新"
                }
              } else {
                $lastLine = ($outputStr -split "`n") | Where-Object { $_.Trim() } | Select-Object -Last 1
                Write-Host "    跳过: $lastLine"
              }
            }
          }
          Write-Host "包升级完成"

      - name: Restore and build (after upgrade)
        if: steps.try_build.outcome == 'failure'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "=== 升级后重新 restore + build ==="
          dotnet restore "Ink Canvas.sln" --verbosity minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::升级后 restore 仍失败，NuGet 包可能不兼容 net10"
            exit 1
          }
          dotnet build "Ink Canvas.sln" -c Release -p:Platform=x64 --no-restore --verbosity minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::升级后 .NET 10 编译仍失败，需要人工介入解决兼容性问题"
            exit 1
          }
          Write-Host "::notice::升级后编译通过"

      - name: Commit and push
        id: push
        shell: pwsh
        run: |
          # 先提交工作区残留变更（如 TFM 修复、lock 文件等）
          git add -A
          $workdirChanges = git status --porcelain
          if ($workdirChanges) {
            git commit -m "chore(sync): apply net10 adjustments after merge from net6 [skip ci]"
          }

          # 检测本地 HEAD 是否领先于 origin/net10（cherry-pick 会自带提交）
          $unpushed = git rev-list --count origin/net10..HEAD
          Write-Host "未推送的提交数: $unpushed"
          if ([int]$unpushed -gt 0) {
            Write-Host "=== 未推送的提交 ==="
            git log origin/net10..HEAD --oneline
            Write-Host "=== 推送到 net10 ==="
            git push origin net10
            Write-Host "::notice::同步完成，已推送到 net10"
            echo "pushed=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::notice::无变更需要推送（本地与 origin/net10 一致）"
            echo "pushed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Trigger .NET Build & Package workflow
        if: steps.push.outputs.pushed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            // GITHUB_TOKEN 推送的 commit 不会自动触发其他 workflow，
            // 所以这里用 workflow_dispatch 主动触发 dotnet-desktop 构建
            const workflowId = 'dotnet-desktop.yml';
            const ref = 'net10';
            core.info(`触发 ${workflowId} 在 ${ref} 分支上运行...`);
            try {
              const resp = await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                ref: ref,
              });
              core.info(`已触发，HTTP ${resp.status}`);
              core.notice(`已触发 .NET Build & Package workflow 在 net10 分支上运行`);
            } catch (err) {
              core.error(`触发失败: ${err.message}`);
              core.setFailed(`无法触发 build workflow: ${err.message}`);
            }

      - name: Create summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Sync net6 → net10 Summary"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "## ✅ Sync Successful"
              echo ""
              echo "**Trigger commit:** \`${{ github.sha }}\`"
              echo "**Run:** #${{ github.run_number }}"
              echo ""
              if [ "${{ steps.try_build.outcome }}" = "success" ]; then
                echo "net6 的提交已同步到 net10，编译验证通过（无需升级 NuGet 包）。"
              else
                echo "net6 的提交已同步到 net10，NuGet 包已升级到最新稳定版，编译验证通过。"
              fi
            else
              echo "## ❌ Sync Failed"
              echo ""
              echo "**Trigger commit:** \`${{ github.sha }}\`"
              echo "**Run:** #${{ github.run_number }}"
              echo ""
              echo "同步失败，请检查上面的日志（会标出具体是哪个提交、哪个文件）："
              echo "- 冲突无法自动解决：修正后可提交 \`resync: <sha>\` 单独重试该提交"
              echo "- NuGet 包不兼容：检查 net6 新增的包是否支持 net10"
              echo "- 编译失败：检查代码兼容性"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
